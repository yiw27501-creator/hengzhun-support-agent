<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衡准 · 客户售后体验</title><link rel="stylesheet" href="/console.css"></head><body><header><a class="brand" href="/">衡准 <span>客户体验 · 合成订单</span></a><a href="/">返回入口</a><a href="/lab">运营视角</a></header><main><div class="eyebrow">Customer experience</div><h1>这笔缺货订单，你希望怎么处理？</h1><p>这里演示购买者的售后体验，没有连接真实商家、账户或支付渠道。</p><p id="status" role="status">正在连接本机服务…</p><div class="grid"><section class="panel"><h2>你的演练订单</h2><button id="start">创建一笔缺货演练订单</button><p id="order">尚未创建订单</p><label>恢复本次浏览器保存的任务<select id="saved"></select></label><h3>提交诉求 / 回复追问</h3><p id="question">尚无待回复问题</p><form id="message"><label>想对客服说什么<textarea id="text" required maxlength="2000" placeholder="例如：先看看有没有同档商品，不要直接退款。"></textarea></label><button id="send" disabled>发送消息</button></form><button id="pause" class="secondary" disabled>先别处理，暂停操作</button><p class="hint">新消息会使未执行任务的旧授权失效。已产生的业务效果不能通过“暂停”撤销；结果不明时应先核对回执。</p></section><section class="panel"><h2>处理进度</h2><p id="stage">等待创建演练订单</p><p id="explain">提交后，你可以切换到运营视角查看同一任务。</p><button id="refresh" class="secondary">刷新进度</button><h3>本次消息</h3><div id="history"></div><p class="hint">这是角色体验分流，不是用户身份验证。当前新诉求的执行授权仍需在运营工作台核对。</p></section></div></main><script src="/customer.js"></script></body></html>
