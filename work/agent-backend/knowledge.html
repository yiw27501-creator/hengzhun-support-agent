<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衡准 · 知识管理</title><link rel="stylesheet" href="/console.css"><header><strong>衡准 <span>售后 Agent 工作空间</span></strong><a href="/lab">任务实验台</a><a href="/knowledge" aria-current="page">知识管理</a><a href="/quality">质量运营</a></header><main><div class="eyebrow">Knowledge</div><h1>让每一次回答，有据可依。</h1><p>政策与 FAQ 分版本管理。草稿不会参与检索；发布需要审核与有效期校验。</p><p id="status" role="status">正在连接…</p><div class="grid"><section class="panel"><h2>新建内容版本</h2><p class="hint">同一标识再次提交会生成新版本，旧内容不会被覆盖。仅填写合成演练内容。</p><form id="create"><label>稳定标识<input name="id" placeholder="refund-policy" pattern="[a-z0-9_-]{1,80}" required></label><label>内容类型<select name="kind"><option value="policy">业务政策</option><option value="faq">FAQ</option></select></label><label>标题<input name="title" required maxlength="2000"></label><label>正文<textarea name="text" required maxlength="2000"></textarea></label><label>来源 / 依据<input name="source" required placeholder="合成演练政策，非商家承诺"></label><label>生效时间（含时区）<input name="effective_from" value="2026-01-01T00:00:00Z" required></label><label>失效时间（含时区）<input name="effective_until" value="2027-01-01T00:00:00Z" required></label><label>FAQ 引用（逗号分隔）<input name="refs" placeholder="refund-policy@1"></label><button>保存为草稿</button></form></section><section class="panel"><h2>审核与发布</h2><label>选择内容<select id="items"></select></label><div id="summary"></div><details><summary>查看版本与引用详情</summary><pre id="detail"></pre></details><label>操作理由<input id="note" placeholder="填写审核、发布或撤销依据" required></label><div id="actions" class="actions"></div><button class="secondary" id="refresh">刷新列表</button><p class="hint">本机使用同一操作者模拟审核，不是企业级双人审批。撤销政策后，依赖它的 FAQ 自动停止提供。恢复旧内容需创建新版本并重新审核。</p></section></div><section class="panel"><h2>当前生效内容</h2><p class="hint">仅此集合参与运行时知识筛选。列表为空时，模型规划会因无政策而转人工。</p><div id="active"></div></section></main><script src="/knowledge.js"></script></html>
