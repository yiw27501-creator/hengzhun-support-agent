name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backend tests
        working-directory: work/agent-backend
        run: python -m unittest discover -q
      - name: Run frozen synthetic workflow evaluation
        working-directory: work/agent-backend
        run: python evaluate_workflow_baseline.py
